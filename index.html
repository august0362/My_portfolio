<!doctype html>
<html lang="en" data-appearance="dark" data-palette="moonlit">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <meta name="theme-color" content="#091321" />
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <!-- Cormorant Garamond + Be Vietnam Pro (SIL OFL) for the Information world (P-15). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap"
    />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('mobius-settings') || 'null');
        document.documentElement.dataset.appearance = saved?.appearance === 'light' ? 'light' : 'dark';
        if (['moonlit', 'rosewater', 'tidal'].includes(saved?.palette)) document.documentElement.dataset.palette = saved.palette;
      } catch { /* Keep the default atmosphere when storage is unavailable. */ }
    </script>
    <title>Celestial Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
